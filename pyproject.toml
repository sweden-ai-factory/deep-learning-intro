[project]
# FIXME: change this
name = "deep-learning-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jupytext>=1.18.1",
  "myst-nb>=1.3.0",
  "sphinx>=8.2.3",
  "sphinx-evita>=0.3.1b0",
  "sphinx-lesson>=0.8.16",
  "sphinxcontrib-bibtex>=2.6.5",
  "sphinxcontrib-mermaid>=2.0.0",
]

[dependency-groups]
dev = [
  { include-group = "notebook" },
  "jupyterlab>=4.4.6",
  "jupyterlab-myst>=2.4.2",
]
# All dependencies used within Jupyter Notebooks
notebook = [
  "jupyter",
  "seaborn",
  "scikit-learn",
  "pandas",
  "tensorflow",
  "pydot",
  "keras",
  "seaborn",
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "torchinfo>=1.8.0",
  "tensorboard>=2.20.0",
  "torchmetrics>=1.8.2",
  "tqdm>=4.67.3",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false
